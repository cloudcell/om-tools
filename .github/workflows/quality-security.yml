name: Quality and security

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# No workflow write permission or repository secrets are required.
permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security:
    name: quality-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (without persistent GitHub credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run compile
      - name: Build extension and bridge
        run: npm run build
      - name: Verify bundled WASM and legal notices
        run: node tools/verify-engine-artifacts.mjs
      - name: Check for sensitive data in tracked files
        run: npm run check:sensitive
      - name: Reject high/critical npm vulnerabilities
        run: npm run audit:gate

# The integration test harness mutates OM Core model state.
# Run it only in an isolated engine environment, never on public PR runners
# connected to a production or shared runtime.
